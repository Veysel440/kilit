title = "Add a foreign key from a VARCHAR column shorter than the parent column"
setup = [
    "ALTER TABLE users ADD UNIQUE INDEX uq_users_name (name)",
    "ALTER TABLE orders ADD COLUMN user_name VARCHAR(50) NULL",
]
session = ["SET foreign_key_checks = 1"]
operation = "ADD CONSTRAINT fk_orders_user_name FOREIGN KEY (user_name) REFERENCES users (name)"
