title = "Add a foreign key from a VARCHAR column to a CHAR column of the same length"
setup = [
    "ALTER TABLE users ADD COLUMN code CHAR(100) NULL",
    "ALTER TABLE users ADD UNIQUE INDEX uq_users_code (code)",
    "ALTER TABLE orders ADD COLUMN user_name VARCHAR(100) NULL",
]
session = ["SET foreign_key_checks = 1"]
operation = "ADD CONSTRAINT fk_orders_user_name FOREIGN KEY (user_name) REFERENCES users (code)"
