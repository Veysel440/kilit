# Each key length scenario indexes a column code: 250 characters of utf8mb4
# take 1000 bytes, the longest key a MyISAM table accepts; 251 take 1004.
title = "Add an index of 1000 bytes to a MyISAM table"
engine = "MyISAM"
setup = [
    "ALTER TABLE orders ADD COLUMN code VARCHAR(250) NULL",
]
operation = "ADD INDEX idx_code (code)"
