# The constraint is named fk_orders_user_name in each of the parent index
# scenarios so that they give the same message, which names it.
title = "Add a foreign key to a parent column with only a non-unique descending index"
setup = [
    "ALTER TABLE users ADD INDEX idx_users_name_desc (name DESC)",
    "ALTER TABLE orders ADD COLUMN user_name VARCHAR(100) NULL",
]
session = ["SET foreign_key_checks = 1"]
operation = "ADD CONSTRAINT fk_orders_user_name FOREIGN KEY (user_name) REFERENCES users (name)"
