title = "Add a two-column foreign key to a UNIQUE index on exactly those columns"
setup = [
    "ALTER TABLE users ADD UNIQUE INDEX uq_users_id_name (id, name)",
    "ALTER TABLE orders ADD COLUMN ref BIGINT UNSIGNED NULL",
    "ALTER TABLE orders ADD COLUMN user_name VARCHAR(100) NULL",
]
session = ["SET foreign_key_checks = 1"]
operation = "ADD CONSTRAINT fk_orders_two FOREIGN KEY (ref, user_name) REFERENCES users (id, name)"
